spring.application.name=seat-reservation-service

# Authentication is the mock-token filter, so Boot's generated default user (and its logged password) is not wanted.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hikari's defaults (10 connections, 30s wait) are deliberate: during a burst requests queue for a connection
# instead of failing. The lock timeout only guards against a stuck transaction holding a seat lock.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '10s'

spring.flyway.enabled=true

spring.jackson.property-naming-strategy=SNAKE_CASE

logging.structured.format.console=ecs

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState,database
management.endpoint.health.group.readiness.include=readinessState,database
management.health.db.enabled=false

reservation.hold-duration=PT5M
reservation.max-seats-per-user=4
reservation.sweep-interval=PT1S
